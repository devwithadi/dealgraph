[project]
name = "dealgraph"
version = "0.1.0"
description = "Evidence-first startup sourcing and one-page investment memo pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "boto3>=1.43.0",
    "litellm>=1.83.3,<2",
    "reportlab>=5.0.1",
]

[project.scripts]
dealgraph = "app.cli.main:main"
ida = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
